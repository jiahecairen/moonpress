  <main id="main"><div class="wrap" style="padding-top:var(--s5);padding-bottom:var(--s6)">
  <div class="section-label" data-reveal><h2>搜索</h2></div>
  <p style="color:var(--ink-2);font-size:var(--fs-1);margin:0 0 var(--s4)">在全部文章里找关键词——标题、摘要、标签、分类都算。</p>
  <div style="max-width:600px;margin:0 auto">
<input id="mpSearch" type="search" placeholder="输入关键词…" autocomplete="off" autofocus style="width:100%;padding:13px 15px;font-size:16px;border:1px solid currentColor;border-radius:10px;background:transparent;color:inherit">
<p id="mpSearchInfo" style="opacity:.6;font-size:13px;margin:12px 2px"></p>
<div id="mpSearchList"></div></div>
<script>(function(){var q,timer;fetch('/moonpress/search.json').then(function(r){return r.json()}).then(function(d){var i=document.getElementById('mpSearch'),o=document.getElementById('mpSearchList'),m=document.getElementById('mpSearchInfo');function esc(s){var e=document.createElement('i');e.textContent=s==null?'':String(s);return e.innerHTML}function run(){var w=i.value.trim().toLowerCase();if(!w){o.innerHTML='';m.textContent='共 '+d.length+' 篇文章，输入即搜';return}var hits=d.filter(function(p){return (p.t+' '+p.s+' '+(p.x||'')+' '+(p.tags||[]).join(' ')+' '+(p.cats||[]).join(' ')).toLowerCase().indexOf(w)>-1}).slice(0,20);m.textContent=hits.length?hits.length+' 篇命中':'没有匹配——换个词试试';o.innerHTML=hits.map(function(p){return '<p style="margin:16px 0"><a href="'+p.u+'"><b>'+esc(p.t)+'</b></a><br><span style="opacity:.65;font-size:13px">'+p.date+' · '+esc(p.s).slice(0,80)+'</span></p>'}).join('')}m.textContent='共 '+d.length+' 篇文章，输入即搜';i.addEventListener('input',function(){clearTimeout(timer);timer=setTimeout(run,160)})})})()</script>
</div>
</main>
